; Autonomous PlatformIO project: Trackle ESP-IDF DUT firmware
; Lives under trackle-library-esp-idf/test/esp-idf/firmware/
;
; Build/flash from this directory:
;   pio run -t upload

[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
build_flags =
        -D FIRMWARE_VERSION=1
        -D FIRMWARE_BUILD=1
        -D IS_PRODUCT
        -D PRODUCT_ID=1000
        -Wno-error
        -Wno-error=format=
        -Wno-format
        -Wno-error=deprecated-enum-enum-conversion
        -Wno-error=deprecated
        ;-D SERVER_PORT=5684
